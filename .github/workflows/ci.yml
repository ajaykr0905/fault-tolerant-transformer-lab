name: deterministic CPU verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked test environment
        run: uv sync --frozen --extra test

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Compile Python sources
        run: uv run --frozen python -m compileall -q src tests

      - name: Run complete test suite
        run: uv run --frozen pytest

      - name: Prove offline real-data recovery matrix
        run: >-
          uv run --frozen pytest
          tests/test_real_data_recovery.py::test_complete_matrix_is_public_safe_and_passes_all_scenarios

      - name: Prove spawned-worker SIGKILL recovery without network access
        run: uv run --frozen pytest tests/test_process_recovery.py

      - name: Exercise synthetic command-line paths
        run: |
          uv run --frozen fttl-train-smoke \
            --config configs/smoke.json \
            --output "${RUNNER_TEMP}/fttl-ci-smoke"
          uv run --frozen fttl-compare-tuning \
            --config configs/smoke.json \
            --output "${RUNNER_TEMP}/fttl-ci-tuning/result.json"

      - name: Run the working prototype and export its offline viewer
        run: uv run --frozen fttl-demo --output "${RUNNER_TEMP}/fttl-ci-demo"

      - name: Compare full and LoRA tuning on the offline prototype dataset
        run: >-
          uv run --frozen fttl-compare-public-tuning
          --config "${RUNNER_TEMP}/fttl-ci-demo/config.json"
          --dataset-manifest "${RUNNER_TEMP}/fttl-ci-demo/dataset/manifest.json"
          --rank 2 --max-eval-tokens 128
          --output "${RUNNER_TEMP}/fttl-ci-public-tuning/result.json"

      - name: Generate bounded tokens from the recovered offline checkpoint
        run: |
          uv run --frozen fttl-generate \
            --config "${RUNNER_TEMP}/fttl-ci-demo/config.json" \
            --checkpoint "${RUNNER_TEMP}/fttl-ci-demo/run/recovered/checkpoints" \
            --dataset-manifest "${RUNNER_TEMP}/fttl-ci-demo/dataset/manifest.json" \
            --prompt Hello --max-new-tokens 4 \
            --output "${RUNNER_TEMP}/fttl-ci-generation.json"

      - name: Verify recovery preserves greedy and seeded inference tokens
        run: >-
          uv run --frozen fttl-verify-inference-parity
          --config "${RUNNER_TEMP}/fttl-ci-demo/config.json"
          --control-checkpoint "${RUNNER_TEMP}/fttl-ci-demo/run/control/checkpoints"
          --recovered-checkpoint "${RUNNER_TEMP}/fttl-ci-demo/run/recovered/checkpoints"
          --dataset-manifest "${RUNNER_TEMP}/fttl-ci-demo/dataset/manifest.json"
          --prompt Hello --prompt Recovery --max-new-tokens 4
          --output "${RUNNER_TEMP}/fttl-ci-inference-parity.json"

      - name: Prove the built wheel runs the offline demo outside the checkout
        run: |
          uv build --wheel --out-dir "${RUNNER_TEMP}/fttl-ci-wheel"
          set -- "${RUNNER_TEMP}/fttl-ci-wheel/"*.whl
          test "$#" -eq 1
          test -f "$1"
          unzip -q "$1" -d "${RUNNER_TEMP}/fttl-ci-wheel-expanded"
          cd "${RUNNER_TEMP}"
          PYTHONPATH="${RUNNER_TEMP}/fttl-ci-wheel-expanded" \
            "${GITHUB_WORKSPACE}/.venv/bin/python" -c \
            'from pathlib import Path; import fttl; from fttl.demo import FIXTURE; assert Path(fttl.__file__).parent == FIXTURE.parent.parent; assert "fttl-ci-wheel-expanded" in str(FIXTURE)'
          PYTHONPATH="${RUNNER_TEMP}/fttl-ci-wheel-expanded" \
            "${GITHUB_WORKSPACE}/.venv/bin/fttl-demo" \
            --output "${RUNNER_TEMP}/fttl-ci-wheel-demo"

      - name: Verify checks did not modify tracked files
        run: |
          git diff --check
          git diff --exit-code
