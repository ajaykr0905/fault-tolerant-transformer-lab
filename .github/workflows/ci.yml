name: deterministic CPU verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: pytest
      - run: fttl-train-smoke --config configs/smoke.json --output artifacts/ci-smoke
      - run: fttl-compare-tuning --config configs/smoke.json --output artifacts/ci-tuning-comparison/result.json
